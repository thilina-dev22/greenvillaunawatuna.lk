<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F382C"/>
      <stop offset="100%" stop-color="#061D15"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="106" stroke="#1D5E49" stroke-width="10" />

  <!-- Botanical Sprout Branch matching Green Villa Identity -->
  <g filter="url(#glow)">
    <!-- Main curving vine -->
    <path d="M 230 410 C 235 310, 270 230, 345 155 C 385 115, 415 95, 435 75" stroke="#4ADE80" stroke-width="18" stroke-linecap="round" fill="none"/>
    
    <!-- Left lower leaf -->
    <path d="M 252 285 C 195 275, 165 225, 180 165 C 225 170, 265 210, 265 275 Z" fill="url(#leafGrad)"/>
    
    <!-- Top middle leaf -->
    <path d="M 345 155 C 345 95, 385 65, 435 75 C 425 125, 385 150, 345 155 Z" fill="url(#leafGrad)"/>
    
    <!-- Top right leaf tip -->
    <path d="M 425 90 C 440 45, 470 30, 485 45 C 480 80, 455 95, 425 90 Z" fill="url(#goldGrad)"/>

    <!-- Refined Monogram "G V" -->
    <text x="100" y="380" font-family="'Playfair Display', Georgia, serif" font-size="195" font-weight="800" fill="#FFFFFF" letter-spacing="-6">G</text>
    <text x="260" y="380" font-family="'Playfair Display', Georgia, serif" font-size="195" font-weight="800" fill="url(#goldGrad)" letter-spacing="-6">V</text>
  </g>
</svg>